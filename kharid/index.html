/* ================= receipt ================= */
route(/^receive-(PO-\d+)$/, (id) => {
  const p = poById(id); if(!p) return "";
  const r = reqById(p.reqId), rec = receivedQty(p);
  after(() => { const b = $("recBtn"); if(b) b.onclick = () => {
    const q = p.lines.map((l,i)=>Math.max(0, Math.min(+$("rq"+i).value||0, l.qty - rec[i])));
    if(q.every(x=>x===0)){ toast("Enter what arrived"); return; }
    S.receipts.push({poId:p.id, lines:p.lines.map((l,i)=>({name:l.name, qty:q[i]})), at:Date.now(), by:ROLES[S.role].name, condition:$("rcond").value});
    const now = receivedQty(p), full = now.every((x,i)=>x>=p.lines[i].qty);
    p.status = full ? "received" : "partially received"; if(full && r.status==="ordered") r.status = "received";
    log(ROLES[S.role].name, `Recorded receipt on ${p.id}: ${q.join(", ")} (${$("rcond").value})`, r.id);
    toast(full ? "Everything's in. Finance can now match the invoice." : `Partial delivery recorded. ${p.lines.map((l,i)=>l.qty-now[i]).reduce((a,b)=>a+b,0)} still to come.`); go(S.role);
  }; });
  return `<a class="back" href="#${S.role}">← Back</a><div class="h1">Confirm what arrived</div><div class="sub">${esc(p.id)} · ${esc(sup(p.sup).name)} · ${esc(r.title)}</div>${progress(r)}
    <div class="card"><table><tr><th>Item</th><th class="n">Ordered</th><th class="n">Already received</th><th class="n">Received now</th></tr>
    ${p.lines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="n">${l.qty}</td><td class="n">${rec[i]}</td><td class="n"><input id="rq${i}" type="number" min="0" max="${l.qty-rec[i]}" value="${l.qty-rec[i]}" style="width:90px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px"></td></tr>`).join("")}</table>
    <div class="field" style="max-width:260px"><label>Condition</label><select id="rcond"><option>Good</option><option>Some damaged</option><option>Wrong items</option></select></div>
    ${rec.every((x,i)=>x>=p.lines[i].qty) ? `<div class="okbox">Everything on this PO has been received.</div>` : `<div class="actions"><button class="btn primary" id="recBtn">Confirm receipt</button></div>`}</div>`;
});

/* ================= invoice ================= */
route(/^invoice-(INV-\d+)$/, (id) => {
  const i = invById(id); if(!i) return `<div class="empty">Invoice not found.</div>`;
  const p = poById(i.poId), r = reqById(p.reqId), s = sup(i.sup), m = matchInvoice(i), g = gstSplit(i.lines, p.city, i.sup);
  const AIx = i.source==="upload" && i.ai ? ` <span class="ai">✦ AI</span>` : i.source==="upload" ? ` <span class="ai" style="background:#eef0f3;color:#6b7280">read</span>` : "";
  after(() => {
    const ap = $("apPay"); if(ap) ap.onclick = () => { i.status = "approved"; r.status = "invoiced"; log("Karan", `Approved ${i.number} for payment (3-way match ${m.state==="matched"?"passed":"overridden"})`, r.id); toast("Approved for payment"); go("finance"); };
    const hd = $("hold"); if(hd) hd.onclick = () => { i.status = "hold"; log("Karan", `Put ${i.number} on hold`, r.id); toast("On hold"); go("finance"); };
    const dup = $("rejDup"); if(dup) dup.onclick = () => { i.status = "rejected"; log("Karan", `Rejected ${i.number} as a duplicate of ${m.dup.number}`, r.id); toast("Rejected as duplicate. Nothing will be paid twice."); go("finance"); };
    const ov = $("override"); if(ov) ov.onclick = () => { modal(`<h3>Override the mismatch?</h3><p class="sub" style="margin-top:6px">This approves ${esc(i.number)} for ${inr(invTotal(i))} despite the differences. The reason is saved in the audit trail.</p><div class="field"><label>Reason</label><textarea id="ovWhy" rows="3"></textarea></div><div class="actions"><button class="btn danger" id="ovYes">Approve anyway</button><button class="link" onclick="closeModal()">Cancel</button></div>`); $("ovYes").onclick = () => { const w = $("ovWhy").value.trim(); if(!w){ $("ovWhy").focus(); return; } i.status = "approved"; i.override = w; r.status = "invoiced"; log("Karan", `Overrode mismatch on ${i.number}: ${w}`, r.id); closeModal(); toast("Approved with override"); go("finance"); }; };
    const cn = $("credit"); if(cn) cn.onclick = async () => {
      modal(`<h3>Ask ${esc(s.name)} for a credit note</h3><p class="sub"><span class="spin"></span> Drafting</p>`);
      const fb = `Dear ${s.name} accounts team,\n\nThank you for invoice ${i.number} dated ${d(i.date)} against our PO ${p.id}.\n\nWe found the following differences:\n${m.issues.map(x=>"- "+x).join("\n")}\n\nPlease send a credit note for ${inr(Math.max(0,m.over))} (or a revised invoice) so we can process payment within the agreed terms.\n\nBest regards,\nKaran\nAccounts, Brightpath Learning`;
      const res = await aiText(`Write a short, polite email from Karan (Accounts, Brightpath Learning) to ${s.name} asking for a credit note or revised invoice. Invoice ${i.number} dated ${d(i.date)}, PO ${p.id}. Differences: ${m.issues.join(" ")} Amount to credit: ${inr(Math.max(0,m.over))}. Under 130 words, list the differences, no em dashes, no placeholders.`, fb);
      $("dialog").innerHTML = `<h3>Credit note request ${res.ai?`<span class="ai">✦ AI</span>`:""}</h3><div class="field"><textarea id="cnTxt" rows="13">${esc(res.text)}</textarea></div><div class="actions"><button class="btn primary" id="cnSend">Send and put invoice on hold</button><button class="link" onclick="closeModal()">Cancel</button></div><p class="sub" style="margin-top:8px">Demo: nothing is emailed.</p>`;
      $("cnSend").onclick = () => { i.status = "hold"; i.creditAsked = Date.now(); log("Karan", `Requested a credit note of ${inr(Math.max(0,m.over))} on ${i.number}`, r.id); closeModal(); toast("Credit note requested. The invoice is on hold."); go("finance"); };
    };
  });
  const res = m.state==="matched" ? `<div class="okbox"><b>3-way match passed.</b> Quantities, prices and GST agree with ${esc(p.id)} and what was received.</div>`
    : m.state==="duplicate" ? `<div class="badbox"><b>Possible duplicate.</b> ${esc(m.msg)}</div>`
    : `<div class="badbox"><b>3-way match found ${m.issues.length} problem${m.issues.length>1?"s":""}.</b><ul style="margin:6px 0 0 18px">${m.issues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${m.over>0?`<div style="margin-top:6px">Overbilled by <b>${inr(m.over)}</b> including GST.</div>`:""}</div>`;
  const acts = i.status==="approved" ? `<div class="note">Approved for payment. <a href="#pay-${esc(i.id)}">Record the payment</a></div>` : i.status==="paid" ? `<div class="okbox">Paid.</div>` : i.status==="rejected" ? `<div class="note">Rejected.</div>`
    : m.state==="matched" ? `<div class="actions"><button class="btn primary" id="apPay">Approve for payment</button><button class="link" id="hold">Hold</button></div>`
    : m.state==="duplicate" ? `<div class="actions"><button class="btn primary" id="rejDup">Reject as duplicate</button><button class="link" id="hold">Hold to check</button></div>`
    : `<div class="actions"><button class="btn primary" id="credit">Request a credit note</button><button class="btn ghost" id="hold">Hold</button><button class="link" id="override">Override with a reason</button></div>${i.creditAsked?`<div class="warnbox">Credit note requested ${d(i.creditAsked)}. Waiting for the supplier.</div>`:""}`;
  return `<a class="back" href="#finance">← Back</a><div class="h1">${esc(s.name)} · ${esc(i.number)}</div><div class="sub">${esc(p.id)} · ${esc(r.title)} · ${r.id}</div>${progress(r)}
    ${res}
    <div class="split"><div class="card"><h2>3-way match</h2><table style="margin-top:8px"><tr><th>Item</th><th class="n">PO qty</th><th class="n">Received</th><th class="n">Invoiced</th><th class="n">PO rate</th><th class="n">Invoice rate</th></tr>
      ${m.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${l.poQty.toLocaleString("en-IN")}</td><td class="n">${l.rec.toLocaleString("en-IN")}</td><td class="n" style="${l.qOk?"":"color:var(--red);font-weight:800"}">${l.invQty.toLocaleString("en-IN")}</td><td class="n">${inr(l.poPrice)}</td><td class="n" style="${l.pOk?"":"color:var(--red);font-weight:800"}">${inr(l.invPrice)}</td></tr>`).join("")}</table>
      ${acts}</div>
    <div class="card"><h2>Invoice details${AIx}</h2><table style="margin-top:8px">
      <tr><td class="muted">Supplier</td><td>${esc(s.name)}</td></tr><tr><td class="muted">GSTIN</td><td>${esc(i.gstin || s.gstin)}</td></tr><tr><td class="muted">Invoice no.</td><td>${esc(i.number)}</td></tr><tr><td class="muted">Date</td><td>${d(i.date)}</td></tr><tr><td class="muted">Due</td><td>${d(i.due)}</td></tr>
      <tr><td class="muted">Subtotal</td><td class="money">${inr(g.base)}</td></tr><tr><td class="muted">${g.intra?"CGST + SGST":"IGST"}</td><td class="money">${inr(g.tax)}</td></tr><tr><td><b>Total</b></td><td class="money"><b>${inr(g.total)}</b></td></tr></table></div></div>`;
});
route(/^upload$/, () => {
  const open = S.pos.filter(p=>p.status!=="draft" && p.status!=="closed");
  after(() => {
    let file = null;
    $("upFile").onchange = e => { file = e.target.files[0] || null; $("upName").textContent = file ? file.name : ""; };
    $("upSample").onclick = () => makeInvoice(null);
    $("upGo").onclick = () => { if(!file){ toast("Choose a file, or try a sample invoice"); return; } makeInvoice(file); };
    async function makeInvoice(f){
      const p = poById($("upPO").value); if(!p) return;
      const btn = f ? $("upGo") : $("upSample"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Reading`;
      const rec = receivedQty(p);
      let lines = p.lines.map((l,i)=>({...l, qty: rec[i] || l.qty})), number = sup(p.sup).name.split(" ").map(w=>w[0]).join("") + "/" + (7000 + S.invoices.length), ai = false, gstin = sup(p.sup).gstin, date = Date.now();
      if(f && sample && /^image\//.test(f.type)){
        try{
          const lim = sample.limits ? await sample.limits() : null;
          if(!lim || lim.images){
            const x = await sample.json(`Read this supplier invoice and return JSON {"number": string, "date": "YYYY-MM-DD", "gstin": string, "lines": [{"name": string, "qty": number, "unitPrice": number (before tax), "gst": number percent}]}. Only what is printed on the invoice.`, {images:[f], modelTier:"quick"});
            if(x && Array.isArray(x.lines) && x.lines.length){ number = x.number || number; gstin = x.gstin || gstin; date = Date.parse(x.date) || date; lines = p.lines.map((l,i)=>({name:l.name, qty:+(x.lines[i]?.qty ?? l.qty), unitPrice:+(x.lines[i]?.unitPrice ?? l.unitPrice), gst:+(x.lines[i]?.gst ?? l.gst)})); ai = true; }
          }
        }catch(e){}
      }
      const inv = {id:"INV-" + String(S.seq.INV++).padStart(4,"0"), poId:p.id, sup:p.sup, number, date, gstin, lines, status:"to_match", source:"upload", ai, due: date + 30*DAY};
      S.invoices.push(inv); log("Karan", `Added invoice ${number} for ${p.id}${ai?" (read by AI)":""}`, p.reqId);
      if(f && !ai) toast("Couldn't read that file automatically. Check the details against the invoice.");
      go("invoice-" + inv.id);
    }
  });
  return `<a class="back" href="#finance">← Back</a><div class="h1">Add an invoice</div><div class="sub">Drop in the supplier's invoice. Kharid reads it and matches it against the PO and receipt.</div>
    <div class="card"><div class="field" style="max-width:520px"><label>Purchase order</label><select id="upPO">${open.map(p=>`<option value="${p.id}">${p.id} · ${esc(sup(p.sup).name)} · ${esc(reqById(p.reqId).title)}</option>`).join("")}</select></div>
      <div class="actions"><label class="btn ghost" style="cursor:pointer">Choose invoice image<input type="file" id="upFile" accept="image/*,application/pdf" hidden></label><span id="upName" class="sub"></span></div>
      <div class="actions"><button class="btn primary" id="upGo">Read and match</button><button class="link" id="upSample">Try a sample invoice instead</button></div>
      <p class="sub" style="margin-top:10px">Invoice images are read with Claude when available. PDFs and other files use the PO's details for you to check.</p></div>`;
});

/* ================= pay ================= */
route(/^pay-(INV-\d+)$/, (id) => {
  const i = invById(id); if(!i) return "";
  const p = poById(i.poId), r = reqById(p.reqId), s = sup(i.sup);
  after(() => { const b = $("payBtn"); if(b) b.onclick = () => {
    const utr = $("utr").value.trim(); if(!/^[A-Z0-9]{8,22}$/i.test(utr)){ $("utr").focus(); toast("Enter the bank UTR reference"); return; }
    i.status = "paid"; S.payments.push({invId:i.id, utr, at:Date.now(), amount:invTotal(i)});
    const allPaid = S.invoices.filter(x=>x.poId===p.id && x.status!=="rejected").every(x=>x.status==="paid") && receivedQty(p).every((q,k)=>q>=p.lines[k].qty);
    if(allPaid){ r.status = "paid"; p.status = "closed"; }
    log("Karan", `Paid ${i.number} · ${inr(invTotal(i))} · ${utr}`, r.id); toast(allPaid ? `Paid. ${r.id} is complete.` : "Paid. The PO stays open for the remaining delivery."); go("finance");
  }; });
  return `<a class="back" href="#finance">← Back</a><div class="h1">Pay ${esc(s.name)}</div><div class="sub">${esc(i.number)} · ${esc(p.id)} · due ${d(i.due)}</div>${progress(r)}
    <div class="card" style="max-width:560px"><div class="sub">Amount</div><div style="font-size:30px;font-weight:800" class="money">${inr(invTotal(i))}</div>
      <div class="sub" style="margin-top:8px">${s.bank ? "Bank details verified on the supplier record." : "Bank details missing on the supplier record."}${s.msme ? " MSME supplier: pay within 45 days." : ""}</div>
      ${i.status==="paid" ? `<div class="okbox">Paid.</div>` : `<div class="field"><label>Bank UTR reference</label><input id="utr" value="UTR${Math.floor(4800000000 + Math.random()*99999999)}"></div><div class="actions"><button class="btn primary" id="payBtn">Mark as paid</button></div>`}</div>`;
});

/* ================= request timeline ================= */
route(/^request-(R\d+)$/, (id) => {
  const r = reqById(id); if(!r) return `<div class="empty">Request not found.</div>`;
  const rfq = rfqFor(r), p = poById(r.poId), recs = p ? S.receipts.filter(x=>x.poId===p.id) : [], invs = p ? S.invoices.filter(x=>x.poId===p.id) : [], pays = S.payments.filter(x=>invs.some(i=>i.id===x.invId));
  const aud = S.audit.filter(a=>a.ref===r.id);
  const AI = f => r.aiFields.includes(f) ? ` <span class="ai">✦ AI</span>` : "";
  return `<a class="back" href="#${S.role}">← Back</a><div class="row" style="justify-content:space-between"><div><div class="h1">${esc(r.title)}</div><div class="sub">${r.id} · ${esc(r.requester.name)}, ${esc(r.dept)} · ${d(r.createdAt)}</div></div>${statusPill(r)}</div>${progress(r)}
    <div class="note">${esc(nextFor(r))}</div>
    <div class="split"><div>
      <div class="card"><h2>Request</h2>${r.raw?`<div class="sub" style="margin-top:4px">They wrote: "${esc(r.raw)}"</div>`:""}
        <table style="margin-top:8px"><tr><th>Item${AI("item")}</th><th class="n">Qty${AI("qty")}</th><th class="n">Unit price${AI("price")}</th><th class="n">Amount</th></tr>${r.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${x.qty}</td><td class="n">${inr(x.unitPrice)}</td><td class="n">${inr(x.qty*x.unitPrice)}</td></tr>`).join("")}</table>
        <div class="sub" style="margin-top:8px">Needed by ${d(r.neededBy)}${AI("date")} · ${esc(r.city)}${AI("city")} · ${esc(r.glCode)} · ${r.source==="catalog"?"Catalog":"Quotes"}</div></div>
      <div class="card"><h2>Approvals</h2>${r.approvals.map(x=>`<div class="q" style="grid-template-columns:1fr auto"><div><div class="t">${esc(x.step)} · ${esc(x.who)}</div><div class="d">${x.at?d(x.at):""}${x.note?" · "+esc(x.note):""}</div></div><span class="pill ${x.status==="approved"?"ok":x.status==="pending"?"warn":x.status==="rejected"?"bad":""}">${esc(x.status)}</span></div>`).join("")}${r.status==="pending" && ROLES[S.role].step===curApproval(r)?.step ? `<div class="actions"><button class="btn primary" data-go="approve-${r.id}">Review</button></div>`:""}</div>
      <div class="card"><h2>Documents</h2>
        ${rfq?qrow(`Quotes · ${esc(rfq.id)}`, `${rfq.quotes.length} quotes${rfq.awarded?` · awarded to ${esc(sup(rfq.awarded).name)}`:""}`, "", "Open", "rfq-"+r.id):""}
        ${p?qrow(`Purchase order · ${esc(p.id)}`, `${esc(sup(p.sup).name)} · ${inr(poTotal(p))} · ${esc(p.status)}`, "", "Open", "po-"+p.id):""}
        ${recs.map(x=>qrow(`Goods receipt · ${d(x.at)}`, `${x.lines.map(l=>l.qty).join(", ")} received · ${esc(x.condition)} · by ${esc(x.by)}`, "", "", "")).join("")}
        ${invs.map(x=>qrow(`Invoice · ${esc(x.number)}`, `${inr(invTotal(x))} · ${esc(x.status.replace("_"," "))}`, "", "Open", "invoice-"+x.id)).join("")}
        ${pays.map(x=>qrow(`Payment · ${esc(x.utr)}`, `${inr(x.amount)} · ${d(x.at)}`, "", "", "")).join("")}
        ${!rfq && !p ? `<div class="sub" style="margin-top:6px">No documents yet.</div>`:""}</div>
    </div><div class="card"><h2>Audit trail</h2><ul class="audit" style="margin-top:6px">${aud.map(a=>`<li><span>${d(a.at)} ${new Date(a.at).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}</span>${esc(a.who)}: ${esc(a.what)}</li>`).join("") || "<li>No entries.</li>"}</ul></div></div>`;
});
route(/^requests$/, () => `<div class="h1">All requests</div><div class="card"><table><tr><th>Request</th><th>Department</th><th class="n">Amount</th><th>Stage</th><th></th></tr>${S.requests.map(r=>`<tr><td><b>${esc(r.title)}</b><div class="sub">${r.id} · ${esc(r.requester.name)} · ${d(r.createdAt)}</div></td><td>${esc(r.dept)}</td><td class="n">${lakh(r.total)}</td><td>${statusPill(r)}<div class="sub">${esc(nextFor(r))}</div></td><td><a href="#request-${r.id}">Open</a></td></tr>`).join("")}</table></div>`);

/* ================= supporting modules ================= */
route(/^suppliers$/, () => `<div class="h1">Suppliers</div><div class="sub">Ratings come from past orders: on-time delivery and invoice accuracy.</div><div class="card"><table><tr><th>Supplier</th><th>Category</th><th>GSTIN</th><th class="n">Score</th><th class="n">Spend this month</th><th>Flags</th></tr>
  ${S.suppliers.map(s=>{ const spend = S.pos.filter(p=>p.sup===s.id).reduce((a,p)=>a+gstSplit(p.lines,p.city,p.sup).base,0); const flags = []; if(!GSTIN_RE.test(s.gstin)) flags.push(["GSTIN format invalid","bad"]); if(!s.bank) flags.push(["Bank details missing","warn"]); if(s.late) flags.push([`${s.late} late deliveries this quarter`,"warn"]); if(s.status!=="Approved") flags.push([s.status,"warn"]); if(s.msme) flags.push(["MSME","teal"]);
    return `<tr><td><b>${esc(s.name)}</b><div class="sub">${STATE[s.state]} · PAN ${esc(s.pan)}</div></td><td>${esc(s.cat)}</td><td class="num">${esc(s.gstin)}</td><td class="n">${Math.round((s.onTime+s.accuracy)/2)}</td><td class="n">${spend?lakh(spend):"·"}</td><td>${flags.map(f=>`<span class="pill ${f[1]}">${esc(f[0])}</span>`).join(" ")}</td></tr>`; }).join("")}</table></div>`);
route(/^budgets$/, () => `<div class="h1">Budgets · this month</div><div class="sub">Committed = open POs. Paid = invoices paid. Alerts at 80%.</div><div class="card"><table><tr><th>Department</th><th class="n">Budget</th><th class="n">Committed</th><th class="n">Paid</th><th class="n">Left</th><th style="width:30%">Used</th></tr>
  ${Object.keys(S.depts).map(k=>{ const b = budget(k), pc = b.used/b.total*100; return `<tr><td><b>${k}</b></td><td class="n">${lakh(b.total)}</td><td class="n">${lakh(b.committed)}</td><td class="n">${lakh(b.paid)}</td><td class="n" style="${b.left<0?"color:var(--red);font-weight:800":""}">${b.left<0?"−":""}${lakh(Math.abs(b.left))}</td><td><div class="bars"><i style="width:${Math.min(100,b.paid/b.total*100)}%;background:var(--teal)"></i><i style="width:${Math.min(100-Math.min(100,b.paid/b.total*100), b.committed/b.total*100)}%;background:#5eead4"></i></div><div class="sub">${Math.round(pc)}% ${pc>=80?`<span class="pill ${pc>=100?"bad":"warn"}">${pc>=100?"Over":"Over 80%"}</span>`:""}</div></td></tr>`; }).join("")}</table></div>`);
route(/^contracts$/, () => `<div class="h1">Contracts</div><div class="card"><table><tr><th>Contract</th><th>Supplier</th><th>Owner</th><th class="n">Value</th><th>Ends</th><th></th></tr>
  ${S.contracts.slice().sort((a,b)=>a.end-b.end).map(c=>{ const dl = Math.round((c.end-NOW)/DAY); return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(sup(c.sup).name)}</td><td>${esc(c.owner)}</td><td class="n">${lakh(c.value)}</td><td>${d(c.end)}</td><td>${dl<=60?`<span class="pill warn">Renews in ${dl} days: review now</span>`:`<span class="pill">${dl} days left</span>`}</td></tr>`; }).join("")}</table></div>`);
route(/^catalog$/, () => `<div class="h1">Catalog</div><div class="sub">Preferred items at fixed prices. Catalog requests skip quotes.</div><div class="card"><table><tr><th>Item</th><th>Category</th><th>Supplier</th><th class="n">Price</th><th class="n">GST</th></tr>${S.catalog.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.cat)}</td><td>${esc(sup(c.sup).name)}</td><td class="n">${inr(c.price)}</td><td class="n">${c.gst}%</td></tr>`).join("")}</table></div>`);
route(/^settings$/, () => {
  after(() => { $("saveSet").onclick = () => { const a = +$("lim1").value, b = +$("lim2").value; if(!(a>0 && b>a)){ toast("The second limit must be higher than the first"); return; } S.settings.deptLimit = a; S.settings.financeLimit = b; log(ROLES[S.role].name, `Changed approval limits to ${inr(a)} / ${inr(b)}`, "settings"); toast("Saved. New requests use these limits."); }; $("reset2").onclick = () => { seed(); toast("Demo reset"); go(S.role); }; });
  return `<div class="h1">Settings</div><div class="card" style="max-width:640px"><h2>Approval matrix</h2>
    <div class="grid2"><div class="field"><label>Department head alone, up to (INR)</label><input id="lim1" type="number" value="${S.settings.deptLimit}"></div><div class="field"><label>Department head + finance, up to (INR)</label><input id="lim2" type="number" value="${S.settings.financeLimit}"></div></div>
    <p class="sub" style="margin-top:10px">Above that, or over the department's budget: department head, finance, then CFO.</p>
    <div class="actions"><button class="btn primary" id="saveSet">Save limits</button><button class="link" id="reset2">Reset demo data</button></div></div>
    <div class="card" style="max-width:640px"><h2>GL codes</h2><table>${Object.entries(GL).map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>`;
});

/* ================= spend ================= */
function insight(){
  const rows = Object.keys(S.depts).map(k=>({k, b:budget(k)})).map(x=>({...x, pc:x.b.used/x.b.total}));
  const hot = rows.sort((a,b)=>b.pc-a.pc)[0];
  const dLeft = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate() - new Date().getDate();
  return `${hot.k} is at ${Math.round(hot.pc*100)}% of its budget with ${dLeft} days left in the month${pendingFor("approver").some(r=>r.dept===hot.k)?", and has requests still waiting":""}.`;
}
function bars(items, max){ return items.map(x=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b style="font-size:13.5px">${esc(x.label)}</b><span class="sub money">${lakh(x.v)}${x.of?` of ${lakh(x.of)}`:""}</span></div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,x.v/max*100)}%" class="${x.of && x.v > x.of ? "over" : ""}"></i></div></div>`).join(""); }
function spendBody(compact){
  const deps = Object.keys(S.depts).map(k=>({label:k, v:budget(k).used, of:S.depts[k]}));
  const cats = {}; S.pos.forEach(p=>{ const r = reqById(p.reqId); const c = r.category || (S.catalog.find(x=>x.id===r.items[0].catalogId)||{}).cat || "Other"; cats[c] = (cats[c]||0) + gstSplit(p.lines,p.city,p.sup).base; });
  const supSpend = {}; S.pos.forEach(p=>{ supSpend[p.sup] = (supSpend[p.sup]||0) + gstSplit(p.lines,p.city,p.sup).base; });
  const committed = Object.keys(S.depts).reduce((a,k)=>a+budget(k).committed,0), paid = Object.keys(S.depts).reduce((a,k)=>a+budget(k).paid,0);
  const savings = S.rfqs.filter(x=>x.awarded).reduce((a,x)=>{ const r = reqById(x.reqId); const q = x.quotes.map(q=>q.unitPrice*r.items[0].qty); const aw = x.quotes.find(q=>q.sup===x.awarded).unitPrice*r.items[0].qty; return a + Math.max(...q) - aw; },0);
  const cyc = S.pos.filter(p=>p.sentAt).map(p=>(p.sentAt - reqById(p.reqId).createdAt)/DAY); const avg = cyc.reduce((a,b)=>a+b,0)/Math.max(1,cyc.length);
  const invNoPo = S.invoices.filter(i=>!poById(i.poId)).length;
  const pct = Math.round(100 * (1 - invNoPo / Math.max(1,S.invoices.length)));
  return `<div class="grid5" style="margin-top:18px">
      <div class="kpi"><b>${lakh(committed)}</b><span>Committed (open POs)</span></div>
      <div class="kpi"><b>${lakh(paid)}</b><span>Paid this month</span></div>
      <div class="kpi"><b>${lakh(savings)}</b><span>Saved through quotes</span></div>
      <div class="kpi"><b>${avg.toFixed(1)} days</b><span>Request to PO, average</span></div>
      <div class="kpi"><b>${pct}%</b><span>Invoices with a PO</span></div></div>
    <div class="note"><b>What to look at:</b> ${esc(insight())}</div>
    <div class="grid2"><div class="card"><h2>By department vs budget</h2>${bars(deps, Math.max(...deps.map(x=>Math.max(x.v,x.of))))}</div>
      <div class="card"><h2>By category</h2>${bars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,v})), Math.max(...Object.values(cats)))}
        <h2 style="margin-top:20px">Top suppliers</h2>${Object.entries(supSpend).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="q" style="grid-template-columns:1fr auto"><div class="t">${esc(sup(k).name)}</div><div class="money">${lakh(v)}</div></div>`).join("")}</div></div>`;
}
route(/^spend$/, () => `<div class="h1">Spend this month</div><div class="sub">Every rupee here went through a request, an approval and a PO.</div>${spendBody()}`);

/* ================= export ================= */
document.addEventListener("click", e => {
  if(e.target.id !== "exportBtn") return;
  const rows = S.invoices.filter(i=>["approved","paid"].includes(i.status)).map(i=>{ const p = poById(i.poId), g = gstSplit(i.lines, p.city, i.sup), s = sup(i.sup), r = reqById(p.reqId); return [iso(i.date), i.number, s.name, s.gstin, p.id, r.glCode, g.base.toFixed(2), g.cgst.toFixed(2), g.sgst.toFixed(2), g.igst.toFixed(2), g.total.toFixed(2), i.status==="paid" ? (S.payments.find(x=>x.invId===i.id)||{}).utr : ""]; });
  const csv = [["Date","Voucher No","Party","Party GSTIN","PO","Ledger","Taxable value","CGST","SGST","IGST","Total","UTR"], ...rows].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  modal(`<h3>Export for Tally / Zoho Books</h3><p class="sub" style="margin-top:6px">${rows.length} purchase vouchers. Copy and save as a .csv file, then import into Tally Prime or Zoho Books.</p><div class="field"><textarea id="csvTxt" rows="10" style="font-family:ui-monospace,monospace;font-size:12px">${esc(csv)}</textarea></div><div class="actions"><button class="btn primary" id="csvCopy">Copy CSV</button><button class="link" onclick="closeModal()">Close</button></div>`);
  $("csvCopy").onclick = async () => { try{ await navigator.clipboard.writeText($("csvTxt").value); toast("Copied"); }catch(err){ $("csvTxt").select(); toast("Select all and copy"); } };
});

/* ================= boot ================= */
$("resetLink").onclick = e => { e.preventDefault(); seed(); toast("Demo reset"); go(S.role); };
seed(); render();
(async () => { try{ sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; }catch(e){ sample = null; } })();

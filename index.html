<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divya Singh · Product Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f2f0; --paper:#ffffff; --ink:#121316; --ink2:#3b3d44; --muted:#6b6e76;
    --line:#e2e0dc; --blue:#2536d4; --blue-soft:#e9ebfb; --dark:#121316;
    --sans:"Inter Tight",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --wrap:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:120px}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px}
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:999px;font-weight:700;font-size:17px;letter-spacing:-.01em;border:2px solid var(--ink);transition:transform .15s,background .15s,color .15s;cursor:pointer;background:transparent;font-family:var(--sans);color:var(--ink)}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.dark{background:var(--ink);color:#fff;height:48px;padding:0 22px;font-size:16px}
  .tag{display:inline-block;font-family:var(--mono);font-size:12.5px;color:var(--blue);background:var(--blue-soft);padding:6px 12px;border-radius:6px}
  .pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 11px;border-radius:999px}
  .ph{background:#fff4d6;border:1px dashed #d9a400;color:#7a5a00;border-radius:6px;padding:1px 7px;font-size:.92em}

  /* header */
  header.top{position:sticky;top:0;z-index:20;background:rgba(243,242,240,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:21px;letter-spacing:-.02em}
  .mark{width:42px;height:42px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:500}
  nav.main{display:flex;align-items:center;gap:32px;font-weight:500;font-size:16.5px}
  nav.main a.lnk:hover{color:var(--blue)}

  /* hero */
  .hero{padding:110px 0 90px}
  .hero h1{font-size:clamp(52px,8.4vw,112px);line-height:.98;font-weight:900;letter-spacing:-.055em;margin:34px 0 40px}
  .hero h1 .b{color:var(--blue)}
  .hero p.lead{font-size:clamp(20px,2vw,25px);color:var(--ink2);max-width:760px;line-height:1.45}
  .hero .ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:44px}

  /* stats */
  .stats{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stats .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:60px;padding-bottom:60px}
  .stat .n{font-size:clamp(34px,3.8vw,52px);white-space:nowrap;font-weight:900;letter-spacing:-.04em;color:var(--blue);line-height:1}
  .stat .l{color:var(--ink2);margin-top:12px;font-size:16.5px;max-width:240px}

  /* sections */
  section.block{padding:110px 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:52px}
  .sec-head h2{font-size:clamp(38px,5vw,66px);line-height:1.02;font-weight:800;letter-spacing:-.045em;margin-top:18px;max-width:900px}
  .sec-head a.u{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:4px}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:30px 28px;display:flex;flex-direction:column;min-height:330px;transition:transform .18s,border-color .18s,box-shadow .18s;cursor:pointer}
  .card:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
  .card .row{display:flex;justify-content:space-between;align-items:center;min-height:32px}
  .card .num{font-family:var(--mono);font-size:14px;color:var(--ink2)}
  .card .co{font-size:14px;color:var(--blue);font-weight:600;margin-top:18px}
  .card h3{font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin-top:6px}
  .card p{color:var(--ink2);margin-top:16px;font-size:17px;flex:1}
  .card .tags{margin-top:22px}

  /* method */
  .method{display:grid;grid-template-columns:1fr 1.15fr;gap:60px;align-items:start}
  .method .intro h2{font-size:clamp(38px,5vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.045em;margin:18px 0 28px}
  .method .intro p{color:var(--ink2);font-size:20px;max-width:520px}
  .steps{display:flex;flex-direction:column;gap:16px}
  .step{display:grid;grid-template-columns:56px 1fr;padding:32px 34px;border-radius:18px;background:var(--paper);border:1.5px solid var(--line)}
  .step.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .step .k{font-family:var(--mono);color:var(--blue);font-size:15px;padding-top:6px}
  .step.on .k{color:#8f9bff}
  .step h4{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .step p{margin-top:8px;color:var(--ink2);font-size:17.5px}
  .step.on p{color:#c9cad0}

  /* about */
  .about{background:var(--dark);color:#fff}
  .about .kicker{color:#8f9bff}
  .about .cols{display:grid;grid-template-columns:1fr 1fr;gap:70px}
  .about h2{font-size:clamp(38px,5vw,62px);line-height:1.03;font-weight:800;letter-spacing:-.045em;margin:18px 0 28px}
  .about p{color:#c9cad0;font-size:19px;margin-bottom:18px}
  .tl{border-top:1px solid #2c2e35}
  .tl .it{display:grid;grid-template-columns:1fr auto;gap:12px;padding:20px 0;border-bottom:1px solid #2c2e35}
  .tl .it b{font-weight:700;font-size:18px;display:block}
  .tl .it span{color:#a3a5ad;font-size:15.5px}
  .tl h5{font-family:var(--mono);font-weight:400;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8f9bff;margin:36px 0 6px}
  .tl h5:first-child{margin-top:0}

  /* contact bar */
  .cbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:26px;background:var(--dark);color:#fff;border-radius:999px;padding:8px 8px 8px 30px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55);white-space:nowrap;max-width:calc(100vw - 24px)}
  .cbar .nm{font-weight:800;font-size:17px}
  .cbar .ci{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:500}
  .cbar .ci svg{width:20px;height:20px}
  .cbar .ci:hover{color:#aeb6ff}
  .cbar .rbtn{display:flex;align-items:center;gap:9px;background:var(--blue);border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px}

  /* detail page */
  .back{display:inline-flex;align-items:center;gap:10px;color:var(--blue);font-weight:700;font-size:18px}
  .dhero{padding:80px 0 0}
  .dmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:56px}
  .dmeta .num{font-family:var(--mono);font-size:15px;color:var(--ink2)}
  .dhero .co{color:var(--blue);font-weight:700;font-size:24px;margin-top:40px;letter-spacing:-.01em}
  .dhero h1{font-size:clamp(48px,7.4vw,98px);line-height:1;font-weight:900;letter-spacing:-.05em;margin:14px 0 34px;max-width:1100px}
  .dhero p.lead{font-size:clamp(20px,2vw,25px);color:var(--ink2);max-width:780px}
  .dhero .ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px}
  .subnav{display:flex;gap:32px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:70px;padding:28px 0 60px;color:var(--ink2);font-size:17px}
  .subnav a:hover{color:var(--blue)}
  .dsec{padding:100px 0;border-top:1px solid var(--line)}
  .dsec.white{background:var(--paper)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
  .dsec h2{font-size:clamp(34px,4.2vw,54px);line-height:1.04;font-weight:800;letter-spacing:-.04em;margin:18px 0 26px}
  .dsec p.body{font-size:19px;color:var(--ink2);max-width:600px}
  .personas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .persona{background:var(--bg);border-radius:18px;padding:30px}
  .persona h4{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .persona p{margin-top:10px;color:var(--ink2);font-size:17px}
  .demo{background:var(--dark);border-radius:22px;padding:18px 22px 22px;margin-top:40px}
  .demo .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13.5px;color:#a3a5ad;padding:4px 6px 16px}
  .demo .bar i{width:11px;height:11px;border-radius:50%;background:#3a3c44;display:inline-block}
  .demo .bar span{margin-left:16px}
  .demo .screen{border-radius:12px;min-height:440px;display:grid;place-items:center;text-align:center;color:#fff;background:repeating-linear-gradient(135deg,#1b1d22 0 22px,#202228 22px 44px)}
  .demo .screen b{font-size:30px;letter-spacing:-.02em;display:block}
  .demo .screen span{color:#c9cad0;font-size:18px;display:block;margin-top:8px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
  .metric{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:32px}
  .metric .n{font-size:clamp(38px,4vw,54px);font-weight:900;letter-spacing:-.04em;color:var(--blue);line-height:1}
  .metric .l{margin-top:12px;color:var(--ink2);font-size:16.5px}
  .did{list-style:none;counter-reset:d;margin-top:10px}
  .did li{counter-increment:d;display:grid;grid-template-columns:56px 1fr;padding:22px 0;border-bottom:1px solid var(--line);font-size:19px}
  .did li::before{content:counter(d,decimal-leading-zero);font-family:var(--mono);color:var(--blue);font-size:15px;padding-top:4px}
  .nextcase{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:70px 0}
  .nextcase .t{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.035em}

  footer{padding:50px 0 30px;color:var(--muted);font-size:15px}

  @media (max-width:900px){
    nav.main a.lnk{display:none}
    .stats .wrap{grid-template-columns:1fr 1fr}
    .method,.about .cols,.two{grid-template-columns:1fr;gap:40px}
    .metrics{grid-template-columns:1fr}
    .personas{grid-template-columns:1fr}
    .cbar{gap:14px;padding-left:20px}
    .cbar .ci .t{display:none}
  }
  @media (max-width:520px){
    .wrap{padding:0 20px}
    .cbar .nm{display:none}
    .hero{padding-top:70px}
  }
</style>
<style>
  .status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
  .status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .status.soon{background:#ecebe8;color:#7b7d84}
  .status.building{background:#fff1d6;color:#a26a00}
  .status.live{background:#dcf5e5;color:#127a3c}
  .card.soon{cursor:default;opacity:.72}
  .card.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
  .card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}
  .card .go{font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px;font-size:16px}
  .card .go.muted{color:var(--muted);font-weight:500}
  .feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:34px}
  .feat div{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:26px;font-size:17.5px;font-weight:600;letter-spacing:-.01em}
  .feat div span{display:block;font-family:var(--mono);font-size:13px;color:var(--blue);font-weight:400;margin-bottom:10px}
  .built{font-size:19px;color:var(--ink2);max-width:760px;white-space:pre-line}
  .shot{width:100%;border-radius:12px;display:block}
  .soonbox{border:1.5px dashed var(--line);border-radius:18px;padding:40px;margin-top:30px;color:var(--ink2);font-size:19px;background:var(--paper)}
  .flow{display:flex;align-items:stretch;gap:0;margin-top:26px}
  .fstep{display:flex;align-items:center;flex:1 1 0;min-width:0}
  .fstep:last-child{flex:0.85 1 0}
  .fbox{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px;flex:1;min-width:0;align-self:stretch}
  .fbox b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
  .fbox span{display:block;color:var(--ink2);font-size:14px;margin-top:6px;line-height:1.35}
  .fbox.hl{border-color:var(--blue);background:#f7f8fe}
  .fbox.hl b{color:var(--blue)}
  .fbox.manual{border-style:dashed}
  .farrow{width:26px;text-align:center;color:var(--muted);font-size:20px;flex:none}
  .fstep:last-child .farrow{display:none}
  .flowcard{background:var(--bg);border-radius:20px;padding:30px;margin-top:22px}
  .flowcard.white{background:var(--paper);border:1.5px solid var(--line)}
  .flowcard .fv{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
  .flowcard h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .flowcard .fnote{color:var(--ink2);margin-top:6px;max-width:820px;font-size:16.5px}
  .branches{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .branch{font-size:14.5px;background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:9px 13px;color:var(--ink2)}
  .branch b{color:var(--ink)}
  .insight{margin-top:22px;border-left:4px solid var(--blue);padding:14px 20px;background:var(--paper);border-radius:0 14px 14px 0;font-size:18px;max-width:900px}
  .insight b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;font-weight:400}
  .wf{margin-top:30px;background:#fbfaf7;border:1.5px dashed #c9c6bf;border-radius:18px;padding:18px;font-family:var(--mono);font-size:12.5px;color:#6c6a64}
  .wf .wbar{display:flex;gap:10px;align-items:center;border:1.5px dashed #c9c6bf;border-radius:10px;padding:10px 12px}
  .wf .wbox{border:1.5px dashed #c9c6bf;border-radius:10px;padding:10px 12px;background:#fff}
  .wf .wpill{border:1.5px dashed #c9c6bf;border-radius:999px;padding:5px 12px;background:#fff;white-space:nowrap}
  .wf .wpill.hl{border-color:var(--blue);color:var(--blue)}
  .wf .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .wf .kp .wbox{height:58px}
  .wf .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px}
  .wf .line{height:9px;background:#e6e3dc;border-radius:5px;margin-top:7px}
  .wf .row{display:grid;grid-template-columns:34px 1fr 50px;gap:10px;align-items:center;padding:9px 0;border-bottom:1.5px dashed #e0ddd6}
  .wf .sq{width:34px;height:34px;border:1.5px dashed #c9c6bf;border-radius:8px}
  .wf .lbl{color:#4a4842;margin-bottom:6px}
  .wf .ann{color:var(--blue)}
  .wf .stack{display:flex;flex-direction:column;gap:10px}
  .wf .screens{display:flex;gap:6px;align-items:stretch;overflow-x:auto}
  .wf .wscreen{flex:1;min-width:190px;border:1.5px dashed #c9c6bf;border-radius:14px;padding:12px;background:#fff}
  .wf .sarrow{align-self:center;color:#9a978f;font-size:18px}
  .wf .wbtn{background:#f1f2fd;border-color:var(--blue);color:var(--blue);text-align:center;border-radius:999px}
  .wf .wopt{background:#fbfaf7}
  .tiles{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin:56px 0 90px}
  .tile{display:flex;flex-direction:column;border-radius:22px;padding:30px;border:1.5px solid var(--line);background:var(--paper);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:420px}
  .tile:hover{transform:translateY(-4px);box-shadow:0 18px 36px -20px rgba(0,0,0,.35);border-color:var(--ink)}
  .tile .tk{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
  .tile h3{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-top:10px}
  .tile p{color:var(--ink2);margin-top:8px;font-size:17px}
  .tile .tgo{margin-top:auto;padding-top:22px;font-weight:700;font-size:17px;color:var(--blue)}
  .tdemo{background:var(--dark);color:#fff;border-color:var(--dark)}
  .tdemo:hover{border-color:var(--blue)}
  .tdemo .tk{color:#8f9bff}
  .tdemo p{color:#c9cad0}
  .tdemo .tgo{color:#fff}
  .tdemo .thumb{margin-top:20px;border-radius:12px;overflow:hidden;border:1px solid #2c2e35;max-height:230px}
  .tdemo .thumb img{width:100%;display:block}
  .tlist{list-style:none;margin-top:20px;border-top:1px solid var(--line)}
  .tlist li{padding:11px 0;border-bottom:1px solid var(--line);font-size:16.5px;font-weight:600;display:flex;justify-content:space-between}
  .tlist li::after{content:"→";color:var(--muted);font-weight:400}
  @media (max-width:900px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}
  .rq{position:fixed;inset:0;background:rgba(18,19,22,.5);display:none;place-items:center;z-index:200;padding:20px}
  body.rqopen .cbar{display:none}
  .rq.show{display:grid}
  .rqd{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:30px;position:relative}
  .rqd h3{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 0 8px;line-height:1.1}
  .rqp{color:var(--ink2);font-size:16px;margin-bottom:8px}
  .rqd label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
  .rqd input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:4px;font:inherit;font-size:15px}
  .rqa{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .rqa .btn{height:50px;font-size:15.5px}
  .rqs{color:var(--muted);font-size:13.5px;margin-top:12px}
  .rqx{position:absolute;top:14px;right:16px;background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer;line-height:1}
  .road{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px;position:relative}
  .rph{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:24px;position:relative}
  .rph.now{border-color:var(--blue)}
  .rph .rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rph .rk{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .rph h4{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:12px;line-height:1.15}
  .rph .when{font-size:14px;color:var(--blue);font-weight:600;margin-top:4px}
  .rph ul{margin-top:12px;padding-left:18px;color:var(--ink2);font-size:15px}
  .rph li{margin-top:5px}

    howBuilt:"Design rule: anyone looking at a screen should know what to do next. So every screen has one primary action, and everything else sits one step back.\n\nBenchmark: I mapped how LeadSquared and HubSpot handle lead capture, qualification, scoring and stages, and kept that logic as the backbone.\n\nSpec: the goal is that no qualified lead goes 7 days without a touch. Core functions: unify sources, rank by a score a rep can trust, and cut the time to write a follow-up. Edge cases: missing deal size, duplicate leads, leads with no history.\n\nUser stories: Given a rep opens the inbox, when leads load, then they are ranked by score with the reasons visible. Given a lead has had no contact for 7+ days, then it is flagged as going stale. Given a client replies on Gmail, when the inbox syncs, then the email is logged on the matching lead, the lead shows Needs reply, and any stage change is suggested, not applied. Given a client says they will get back by a date, then the next step is to wait until that date, and becomes Follow up once it passes. Given the rep opens a lead, then a deal summary shows the first call, products pitched, SPOC, introductions, quotation and next agreed date. Given the rep sends an email from Gmail, when the inbox syncs, then it is logged as sent, and if there is no reply in 4 days the next step becomes Nudge. Given a call happens off email, when the rep adds a note, then it is logged as Manual.\n\nMoSCoW: Must, unified inbox, score, stale flag, follow-up draft. Should, Gmail sync with manual override. Could, calendar sync and CRM export. Won't (for the MVP), auto-sending emails or auto-applying stage changes.\n\nScoring is rule-based on purpose (deal size, stage, recency, engagement) so reps can see and trust why a lead ranks where it does. AI is used where it saves the most time: writing and extracting.",

  { id:"course-recommender", name:"Course Recommender", status:"live",
    problem:"Learners cannot pick the right programme from a large catalogue, so they drop off or ask counsellors the same questions again and again.",
    tags:["EdTech","Natural language","LLM"],
    personas:[
      {name:"Working professional", need:"Knows the goal (switch, grow, lead) but not which of 60 programmes gets them there within their time and budget."},
      {name:"Admissions counsellor", need:"Spends the first 15 minutes of every call asking the same profile questions before giving real advice."},
      {name:"Programme manager", need:"Cannot see which programmes learners are matched to, or why they drop off before enrolling."}
    ],
    features:[
      "Describe it in your own words: one text box, with tap-to-use example prompts, instead of a catalogue",
      "An LLM turns the description into a structured profile (goal, current area, experience, time, budget), shown back as editable chips",
      "One best match with a match score, a personal two-line explanation in the learner's words, and the rule-based reasons it fits",
      "Refine in plain language: 'something cheaper', 'I only have weekends', 'more about leadership'",
      "A single next step on the result: book a free 15-minute counsellor call, with the learner's profile and match reasons handed to the counsellor",
      "Fallbacks: 5 quick questions for learners who prefer to tap, and built-in rules when AI is unavailable"
    ],
    flowHead:"From a filterable catalogue to a prompt-based answer.",
    flowIntro:"I started from how large course marketplaces present a catalogue, mapped it, then replaced it once it was clear learners did not know which filters mattered.",
    flows:[
      {version:"v0 · Flowchart", title:"Browse-and-filter catalogue", note:"The common pattern: land on a catalogue, filter by subject, compare programme pages, then fill an enquiry form.",
       steps:[{t:"Land on catalogue",d:"60+ programmes"},{t:"Filter",d:"Subject, duration, fee"},{t:"Compare pages",d:"Open 4 to 6 tabs"},{t:"Enquiry form",d:"Name, phone, programme"},{t:"Counsellor call",d:"Starts by asking profile questions"},{t:"Enrol or drop",d:"Most drop before the call"}],
       insight:"Learners think in goals (switch, grow, lead), not subjects. Filters asked them to know the answer already, and counsellors re-asked everything the form never captured."},
      {version:"v1 · Flowchart", title:"Prompt-based match with counsellor handoff", white:true, note:"Let the learner say it in their own words. Understand it, show what was understood, give one answer, and hand the context to the counsellor.",
       steps:[{t:"Describe the goal",d:"In plain language, or tap an example",hl:true},{t:"LLM understands",d:"Extracts goal, area, experience, time, budget",hl:true},{t:"Match",d:"Rules + topic words score every programme",hl:true},{t:"Best match",d:"Score, reasons, what to know"},{t:"Book a call",d:"Pick a slot, name, phone"},{t:"Handoff",d:"Counsellor gets answers and match reasons",hl:true}],
       branches:[["Understood something wrong:","tap a chip to correct it"],["Wants a change:","refine in plain language"],["Prefers to tap:","5 quick questions instead"],["Not convinced:","see 2 other matches"],["Has a question:","AI answers from programme facts, else defers to the counsellor"]]}
    ],
    wireframe:{version:"v1 · Wireframe", title:"Three screens, one action each", note:"Every screen has a single primary action, so a learner always knows what to do next.",

    howBuilt:"Design rule: one primary action per screen. The learner writes one message, sees one answer, and has one button to press.\n\nBenchmark: I mapped the browse-and-filter pattern used by large course marketplaces. Learners think in goals and situations, not subjects, so v1 started as five guided questions. v2 goes one step further: the learner simply describes their situation, the way they would to a counsellor.\n\nSpec: the goal is a confident shortlist in under a minute, with zero profile questions re-asked by the counsellor. Core functions: free-text understanding, a visible and editable interpretation, transparent matching, one recommendation with reasons, plain-language refinement, booking and a handoff note. Edge cases: missing budget or experience (treated as open, shown as a chip to edit), wrong interpretation (tap a chip to fix), ties (prefer the programme built for the learner's main goal, then the lower fee).\n\nPrompt design: the LLM returns strict JSON with fixed values per field, so the output can be scored by rules and shown back to the learner. A separate prompt writes a two-sentence explanation grounded only in programme facts and the learner's own words. Refinement sends the current profile plus the new instruction and asks for an updated JSON, changing only what the words imply.\n\nUser stories: Given a learner describes their goal, when they press Find my programme, then they see what was understood as chips and one best match with reasons. Given a chip is wrong, when they tap it, then they can correct just that answer. Given they type 'something cheaper', then the match updates within the new budget. Given they book a call, then the counsellor receives their profile and the match reasons.\n\nMoSCoW: Must, free-text understanding, editable interpretation, matching, one result, booking, handoff. Should, plain-language refine, programme Q&A, question fallback. Could, compare two programmes. Won't (for the MVP), payments or enrolment.",

  { id:"job-tracker", name:"AI Job Tracker", status:"live", demoAccess:"request",
    problem:"A job search runs across dozens of email threads, spreadsheets and portals, so replies slip, follow-ups get forgotten and nobody knows what to do next.",
    tags:["AI","Gmail","Personal productivity"],
    personas:[
      {name:"Active job seeker", need:"Juggles 20 to 40 live conversations and loses track of who is waiting on whom."},
      {name:"Busy professional", need:"Has 10 minutes a day for the search and needs to know the single most important thing to do."},
      {name:"Referrer or mentor", need:"Wants a quick, accurate picture of where each application stands before making an intro."}
    ],
    features:[
      "Gmail sync both ways: an LLM finds real job conversations and ignores alerts, newsletters and self-sent digests",
      "Whose move it is on every application, with one clear next step (reply, follow up, wait, prepare)",
      "Send from the tracker: an AI-drafted reply in the same Gmail thread, the right CV attached automatically, sent only after the user confirms",
      "Every email tagged: sent from the tracker (AI draft as is or edited), written in Gmail, from a person, or automated by a hiring system",
      "Automated hiring-system emails never show as 'your move'",
      "Excel tracker import, with imported rows flagged so nothing gets mixed up",
      "Private by design: each person's tracker is stored only for them"
    ],
    flowHead:"From a spreadsheet to an inbox that tells you what to do.",
    flowIntro:"I started from how most people track a job search, a spreadsheet updated by hand, mapped where it breaks, and rebuilt it around the inbox where the conversations actually happen.",
    flows:[
      {version:"v0 · Flowchart", title:"Spreadsheet tracking", note:"The usual setup: apply, log it in Excel, check Gmail, update the sheet, remember to follow up.",
       steps:[{t:"Apply",d:"Portal, email or referral"},{t:"Log in Excel",d:"Company, role, date, status"},{t:"Check Gmail",d:"Scan for replies"},{t:"Update sheet",d:"By hand, when remembered"},{t:"Follow up",d:"If it was noticed"},{t:"Outcome",d:"Often lost in the inbox"}],
       insight:"The sheet was always behind the inbox. Replies sat unanswered for days, automated 'we received your application' emails looked like real replies, and follow-ups depended on memory."},
      {version:"v1 · Flowchart", title:"Inbox-first tracker", white:true, note:"Gmail is the source of truth. The tracker reads it, decides whose move it is, and prepares the next email for the user to send.",
       steps:[{t:"Sync Gmail",d:"Received and sent mail",hl:true},{t:"Find job threads",d:"LLM classification + rules",hl:true},{t:"Whose move",d:"Person vs automated sender",hl:true},{t:"Next step",d:"Reply, follow up, wait"},{t:"Draft + attach",d:"AI reply, CV attached",hl:true},{t:"User sends",d:"Confirm, then send",manual:true}],
       branches:[["Automated hiring-system email:","no reply needed"],["No reply in 7 days:","follow up"],["Not a job email:","hide, never re-checked"],["Existing Excel tracker:","import with a flag"]]}
    ],
    wireframe:{version:"v1 · Wireframe", title:"Three screens, one action each",
      screens:[
        {name:"Today", blocks:[["Today bar: the one next action","Gmail sync first, then replies"],["Open top application","Primary",'btn'],["Chips: your move · follow up · interviews · waiting","",'opt']]},
        {name:"Application", blocks:[["Company, role, contact",""],["Your next step + one button","Reply, follow up or wait"],["Show the conversation","Every email tagged",'opt'],["Stage, follow-up date, notes",""]]},
        {name:"Compose", blocks:[["To + subject, in the same thread",""],["AI-drafted message","Editable"],["Attachments: default CV auto-added","",'opt'],["Send email, then confirm","Primary",'btn']]}
      ]},
    howBuilt:"Design rule: one primary action per screen, so the user always knows what to do next.\n\nSpec: the goal is that no recruiter email waits more than 24 hours and no application goes 7 days without a follow-up. Core functions: two-way Gmail sync, job-thread classification, whose-move logic, next steps, AI drafting, sending with attachments, and import from the existing spreadsheet. Edge cases: automated hiring-system emails, recruiter agencies, threads that are not job emails, manual edits that must survive every sync.\n\nUser stories: Given a recruiter replies, when the inbox syncs, then the application shows 'Your move' with a drafted reply one click away. Given the user presses Send, then a confirmation shows the recipient and attachments, and nothing is sent until they confirm. Given an automated 'application received' email, then no reply is suggested. Given an Excel tracker is imported, then matching rows are tagged and only empty fields are filled.\n\nMoSCoW: Must, Gmail sync, next steps, drafting, user-confirmed sending, privacy. Should, attachments, email tagging, Excel import. Could, scores, conversation flowchart, CV-to-JD match, interview prep, analytics, calendar. Won't, sending anything without the user's confirmation.\n\nPrompt design: threads are classified in batches into strict JSON (company, role, stage, contact, next step, promised dates), with rule-based fallbacks when AI is unavailable. Drafts are written from the real thread, never invented.",
    roadmap:[
      {phase:"Phase 0", title:"Discover and wireframe", when:"Week 1", status:"done", items:["Mapped the spreadsheet workflow and where it breaks","Defined whose-move logic","Three-screen wireframe"]},
      {phase:"Phase 1", title:"Inbox-first MVP", when:"Week 2", status:"done", items:["Two-way Gmail sync","LLM job-thread classification","Next steps and AI drafts","Private per-user storage"]},
      {phase:"Phase 2", title:"Send, attach, import", when:"Week 3", status:"done", items:["Send from the tracker with confirmation","Documents library with default CV","Email tagging: AI, manual, person, automated","Excel import with flags"]},
      {phase:"Phase 3", title:"Command centre", when:"Next", status:"now", items:["Priority score and offer likelihood","Conversation flowchart","CV-to-JD match and interview prep","Pipeline analytics and calendar"]}
    ],
    roadmapHead:"Built in phases, each one shipped.",
    metrics:[
      {value:"< 24 h", label:"Target: time any recruiter email waits for a reply"},
      {value:"0", label:"Target: applications left 7+ days without a follow-up"},
      {value:"1 click", label:"Target: from 'your move' to a ready-to-send email"}

  { id:"kharid", name:"Kharid · AI Procure-to-Pay", status:"live",
    problem:"Mid-size Indian companies buy through email, Excel and WhatsApp, so approvals stall, budgets are blown before anyone notices, and finance pays invoices that don't match what was ordered or received.",
    tags:["B2B SaaS","Procurement","AI"],
    personas:[
      {name:"Requester", need:"Needs 15 laptops for new hires and doesn't know the process, the budget or who approves."},
      {name:"Approver and CFO", need:"Gets requests on WhatsApp with no context: is it in budget, is the price fair, what did this person buy before?"},
      {name:"Procurement lead", need:"Chases three suppliers for quotes, compares them in Excel and retypes everything into a PO."},
      {name:"Finance (accounts payable)", need:"Checks every invoice against the PO and the delivery by hand, and still pays duplicates and overbilling."}
    ],
    features:[
      "Plain-language intake: '15 laptops for the Bengaluru hires, under 70k each, by 15 Dec' becomes a filled request, with AI-filled fields marked",
      "Live budget check and automatic approval routing: department head, then finance, then CFO above ₹5 lakh or over budget",
      "Approval card with an AI summary, budget impact and the requester's history: approve in one click",
      "Catalog items skip quotes; everything else goes out as an RFQ, and quotes are compared on 3-year cost (price, GST, warranty, delivery, supplier score), not just price",
      "GST-correct purchase orders: CGST + SGST within a state, IGST across states",
      "Partial deliveries recorded against the PO",
      "3-way match of PO, receipt and invoice, with mismatches explained in plain language: overbilling, short delivery, duplicates, wrong GSTIN",
      "Credit note request drafted by AI, payment with UTR, and export for Tally or Zoho Books",
      "Spend dashboard, supplier scores, contract renewals and a full audit trail"
    ],
    flowHead:"From email, Excel and WhatsApp to one procure-to-pay loop.",
    flowIntro:"I benchmarked established Indian procure-to-pay platforms such as ProcureDesk, mapped how a 400-person company actually buys today, and rebuilt the loop so each role sees only their next action.",
    flows:[
      {version:"v0 · Flowchart", title:"How buying happens today", note:"A request on email or WhatsApp, quotes in Excel, a PO typed by hand and invoices checked by eye.",
       steps:[{t:"Ask on WhatsApp",d:"No form, no budget check"},{t:"Approval by message",d:"Lost in chats"},{t:"Quotes in Excel",d:"Price only"},{t:"PO typed by hand",d:"GST errors"},{t:"Goods arrive",d:"Nobody records it"},{t:"Invoice paid",d:"Matched by eye, if at all"}],
       insight:"Budgets were tracked after the money was spent, the cheapest quote often cost more over three years, and finance had no record of what actually arrived."},
      {version:"v1 · Flowchart", title:"AI procure-to-pay", white:true, note:"Every request carries its budget, approvals, quotes, PO, receipt, invoice and payment in one timeline.",
       steps:[{t:"Describe the need",d:"AI fills the request",hl:true},{t:"Budget + routing",d:"Right approvers, automatically",hl:true},{t:"Approve",d:"AI summary, one click"},{t:"Source",d:"Catalog or RFQ, compared on 3-year cost",hl:true},{t:"PO + receipt",d:"GST split, partial deliveries"},{t:"3-way match + pay",d:"Mismatches explained, UTR, Tally export",hl:true}],
       branches:[["Over budget:","adds finance and CFO to the chain"],["Catalog item:","skips quotes, PO straight away"],["Quote too high:","AI drafts a counter-offer"],["Invoice overbilled:","AI drafts a credit note request"],["Duplicate invoice:","blocked before payment"]]}
    ],
    wireframe:{version:"v1 · Wireframe", title:"One screen per role, one action each",
      screens:[
        {name:"Requester", blocks:[["What do you need? (plain language)",""],["Filled form, AI fields marked","Editable"],["Budget check + who approves",""],["Submit request","Primary",'btn']]},
        {name:"Approver", blocks:[["AI summary + amount",""],["Budget impact bar",""],["Requester's history","",'opt'],["Approve","Primary",'btn'],["Reject · Ask a question","Secondary",'opt']]},
        {name:"Procurement", blocks:[["Quotes side by side",""],["Recommendation with reasons","3-year cost"],["Award","Primary",'btn'],["Negotiate first","AI counter-offer",'opt']]},
        {name:"Finance", blocks:[["3-way match: PO · received · invoiced",""],["Problems in plain language",""],["Approve for payment or request credit note","Primary",'btn'],["Export for Tally / Zoho","",'opt']]}

    howBuilt:"Design rule: one primary action per screen. Five roles share one system, but each person opens it to a single 'next up' bar.\n\nBenchmark: I studied ProcureDesk and similar Indian procure-to-pay platforms, then mapped how buying works today at a typical 400-person company, modelled in the demo as a fictional EdTech firm with six department budgets. The approval matrix (₹50k, ₹5 lakh, over budget) is editable in settings.\n\nAI where it saves effort: plain-language intake, approval summaries, invoice reading, and counter-offer and credit note drafts. Every AI step has a rule-based fallback, so the demo always works. Quote recommendations are deliberately rule-based and explained line by line, so a buyer can defend the award in an audit.\n\nIndia-specific: GST split by place of supply, GSTIN validation, MSME payment terms, UTR on payment and a Tally / Zoho Books export.\n\nThe demo is seeded with 23 requests and 12 suppliers, including a clean invoice, an overbilled one, a short delivery and a duplicate, so every path can be tried.",

      {phase:"Phase 2", title:"Receive to pay", when:"Week 3", status:"done", items:["Partial receipts","3-way match with plain-language mismatches","Credit notes, UTR and Tally export"]},
      {phase:"Phase 3", title:"Production", when:"Next", status:"now", items:["Supplier portal for quotes and invoices","Email and WhatsApp intake","ERP sync and e-invoicing (IRN) checks"]}
    ],

      <h5>Community</h5>
      <div class="it"><div><b>ISB Executive Alumni Network</b><span>Core committee member</span></div></div>
      <div class="it"><div><b>CETAA, CET alumni association</b><span>Core committee, Delhi and Mumbai chapters</span></div></div>
    </div>
  </div></section>
  <footer><div class="wrap">© ${esc(PROFILE.name)} · ${esc(PROFILE.title)}</div></footer>`;
}

function product(p, view){
  const i = PRODUCTS.indexOf(p);
  const others = PRODUCTS.filter(x=>x!==p && x.status!=="soon");
  const nk = others.findIndex(x=>PRODUCTS.indexOf(x)>i); const next = others.length ? (nk<0 ? others[0] : others[nk]) : null;
  const gated = p.demoAccess === "request";
  const demoBtn = p.demoUrl ? (gated ? `<button class="btn primary" data-request="${esc(p.id)}">Request demo access ${arrow}</button>` : `<a class="btn primary" href="${esc(p.demoUrl)}" target="_blank" rel="noopener">Open live demo ${arrow}</a>`) : "";
  const has = {
    users: p.personas && p.personas.length,
    features: p.features && p.features.length,
    built: p.howBuilt,
    metrics: p.metrics && p.metrics.length,
    demo: p.demoUrl || p.screenshot
  };
  has.flows = p.flows && p.flows.length; has.roadmap = p.roadmap && p.roadmap.length;
  const nav = [["d-users","Problem and users",has.users],["d-flow","Wireframe and flow",has.flows||p.wireframe],["d-features","What it does",has.features],["d-built","Spec and user stories",has.built],["d-roadmap","Roadmap",has.roadmap],["d-metrics","Success metrics",has.metrics]].filter(x=>x[2]);
  const backIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m6 6-6-6 6-6"/></svg>';
  const foot = `<footer><div class="wrap">© ${esc(PROFILE.name)} · ${esc(PROFILE.title)}</div></footer>`;

  if(view==="build"){
    let n = 0; const k = t => `<div class="kicker">${pad(++n)} · ${t}</div>`;
    return `
  <section class="dhero"><div class="wrap">
    <a class="back" href="#${p.id}">${backIcon}${esc(p.name)}</a>
    <div class="co" style="margin-top:40px">How I built it</div>
    <h1 style="margin-top:10px">${esc(p.name)}</h1>
    <p class="lead">${esc(p.problem)}</p>
    <nav class="subnav">${nav.map(x=>`<a data-jump="${x[0]}" href="#${p.id}-build">${x[1]}</a>`).join("")}</nav>
  </div></section>

  ${has.users?`<section class="dsec white" id="d-users"><div class="wrap two">
    <div>${k("Problem and users")}<h2>Who it is for.</h2><p class="body">${esc(p.problem)}</p></div>
    <div class="personas">${p.personas.map(x=>`<div class="persona"><h4>${esc(x.name)}</h4><p>${esc(x.need)}</p></div>`).join("")}</div>
  </div></section>`:""}

  ${(has.flows||p.wireframe)?`<section class="dsec" id="d-flow"><div class="wrap">
    ${k("Wireframe and flow")}<h2>${esc(p.flowHead||"How the product thinks.")}</h2>
    ${p.flowIntro?`<p class="body">${esc(p.flowIntro)}</p>`:""}
    ${(p.flows||[]).map(renderFlow).join("")}
    ${p.wireframe?renderWireframe(p.wireframe):""}
  </div></section>`:""}

  ${has.features?`<section class="dsec white" id="d-features"><div class="wrap">
    ${k("What it does")}<h2>Core features.</h2>
    <div class="feat">${p.features.map((f,j)=>`<div><span>${pad(j+1)}</span>${esc(f)}</div>`).join("")}</div>
  </div></section>`:""}

  ${has.built?`<section class="dsec" id="d-built"><div class="wrap">
    ${k("How I built it")}<h2>Spec, stories, prototype.</h2>
    <div class="built">${esc(p.howBuilt)}</div>
  </div></section>`:""}

  ${has.roadmap?`<section class="dsec white" id="d-roadmap"><div class="wrap">
    ${k("Roadmap")}<h2>${esc(p.roadmapHead||"Where it goes next.")}</h2>
    <div class="road">${p.roadmap.map(r=>`<div class="rph ${r.status==='now'?'now':''}">
      <div class="rtop"><span class="rk">${esc(r.phase)}</span><span class="rs ${r.status}">${esc(RSTAT[r.status]||r.status)}</span></div>
      <h4>${esc(r.title)}</h4><div class="when">${esc(r.when||"")}</div>
      <ul>${(r.items||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
  </div></section>`:""}

  ${has.metrics?`<section class="dsec" id="d-metrics"><div class="wrap">
    ${k("Success metrics")}<h2>How I know it works.</h2>
    <div class="metrics">${p.metrics.map(m=>`<div class="metric"><div class="n">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join("")}</div>
  </div></section>`:""}


  <section class="wrap nextcase"><div><div class="kicker">Seen how it was built?</div><div class="t">Now try the product.</div></div>${demoBtn}</section>
  ${foot}`;
  }

  const tiles = (p.status==="soon" || !(has.demo||nav.length)) ? `<div class="soonbox">This product is in build. The demo and the story of how it was built will appear here as soon as it ships.</div><div style="height:80px"></div>` : `
    <div class="tiles">
      ${has.demo?`<a class="tile tdemo" ${p.demoUrl ? (gated ? `href="#${p.id}" data-request="${esc(p.id)}"` : `href="${esc(p.demoUrl)}" target="_blank" rel="noopener"`) : ''}>
        <div class="tk">01 · Product demo</div>
        <h3>Try the live product</h3>
        <p>${gated ? 'A working tool connected to real Gmail data, so access is by request.' : 'Click through the working prototype, built and shipped end to end.'}</p>
        ${p.screenshot?`<div class="thumb"><img src="${p.screenshot}" alt="${esc(p.name)} screenshot"></div>`:""}
        <span class="tgo">${p.demoUrl ? (gated ? 'Request demo access →' : 'Open live demo ↗') : 'Demo coming soon'}</span>
      </a>`:""}
      ${nav.length?`<a class="tile tbuild" href="#${p.id}-build">
        <div class="tk">02 · How I built it</div>
        <h3>From problem to shipped</h3>
        <p>The thinking behind the product, step by step.</p>
        <ul class="tlist">${nav.map(x=>`<li>${x[1]}</li>`).join("")}</ul>
        <span class="tgo">See how I built it →</span>
      </a>`:""}
    </div>`;
  return `
  <section class="dhero"><div class="wrap">
    <a class="back" href="#products">${backIcon}All products</a>
    <div class="dmeta"><span class="num">${pad(i+1)} / ${pad(PRODUCTS.length)}</span>${statusPill(p.status)}${tagLine(p.tags)}</div>
    <h1 style="margin-top:34px">${esc(p.name)}</h1>
    <p class="lead">${esc(p.problem)}</p>
    ${tiles}
  </div></section>
  ${next?`<section class="wrap nextcase"><div><div class="kicker">Next product</div><div class="t">${esc(next.name)}</div></div><a class="btn primary" href="#${next.id}">View ${arrow}</a></section>`:""}
  ${foot}`;
}

const RSTAT = {done:"Done", now:"In progress", next:"Next", later:"Later"};
function renderFlow(f){
  return `<div class="flowcard ${f.white?'white':''}">
    <div class="fv">${esc(f.version)}</div><h3>${esc(f.title)}</h3>${f.note?`<p class="fnote">${esc(f.note)}</p>`:""}
    <div class="flow">${f.steps.map(st=>`<div class="fstep"><div class="fbox ${st.hl?'hl':''} ${st.manual?'manual':''}"><b>${esc(st.t)}</b>${st.d?`<span>${esc(st.d)}</span>`:""}</div><div class="farrow">→</div></div>`).join("")}</div>
    ${f.branches?`<div class="branches">${f.branches.map(b=>`<div class="branch"><b>${esc(b[0])}</b> ${esc(b[1])}</div>`).join("")}</div>`:""}
    ${f.insight?`<div class="insight"><b>What we learned</b>${esc(f.insight)}</div>`:""}
  </div>`;
}
function renderWireframe(w){
  if(w.screens) return `<div class="flowcard white"><div class="fv">${esc(w.version||"Wireframe")}</div><h3>${esc(w.title)}</h3>${w.note?`<p class="fnote">${esc(w.note)}</p>`:""}
  <div class="wf"><div class="screens">${w.screens.map((sc,i)=>`<div class="wscreen"><div class="lbl">${pad(i+1)} · ${esc(sc.name)}</div>${sc.blocks.map(b=>`<div class="wbox ${b[2]==='btn'?'wbtn':''} ${b[2]==='opt'?'wopt':''}" style="margin-top:8px">${esc(b[0])}${b[1]?`<div class="ann" style="margin-top:4px">← ${esc(b[1])}</div>`:""}${b[2]?'':'<div class="line" style="width:70%"></div>'}</div>`).join("")}</div>`).join('<div class="sarrow">→</div>')}</div></div></div>`;
  const rows = n => Array.from({length:n},()=>`<div class="row"><div class="sq"></div><div><div class="line" style="width:55%;margin:0"></div><div class="line" style="width:85%"></div></div><div class="line" style="margin:0"></div></div>`).join("");
  return `<div class="flowcard white"><div class="fv">${esc(w.version||"Wireframe")}</div><h3>${esc(w.title)}</h3>${w.note?`<p class="fnote">${esc(w.note)}</p>`:""}
  <div class="wf">
    <div class="wbar"><span class="wbox" style="padding:6px 10px">LOGO</span><span style="flex:1">${esc(w.topLabel||"")}</span>${(w.topActions||[]).map(a=>`<span class="wpill ${a[1]?'hl':''}">${esc(a[0])}</span>`).join("")}</div>
    <div class="kp">${(w.kpis||[]).map(x=>`<div class="wbox">${esc(x)}<div class="line" style="width:40%"></div></div>`).join("")}</div>
    <div class="cols">
      <div class="wbox"><div class="lbl">${esc(w.left)}</div>${rows(w.leftRows||5)}${w.leftNote?`<div class="ann" style="margin-top:8px">↑ ${esc(w.leftNote)}</div>`:""}</div>
      <div class="wbox stack"><div class="lbl">${esc(w.right)}</div>${(w.rightBlocks||[]).map(b=>`<div class="wbox" style="background:#fbfaf7">${esc(b[0])}${b[1]?`<div class="ann" style="margin-top:4px">← ${esc(b[1])}</div>`:""}<div class="line" style="width:70%"></div></div>`).join("")}</div>
    </div>
  </div></div>`;
}
function fillChrome(){
  document.getElementById("brandName").textContent = PROFILE.name;
  document.getElementById("cbName").textContent = PROFILE.name;
  const ph = document.getElementById("cbPhone"); ph.href = "tel:"+PROFILE.phone.replace(/\s/g,""); ph.title = PROFILE.phone; ph.querySelector(".t").textContent = PROFILE.phone;
  const em = document.getElementById("cbEmail"); em.href = "mailto:"+PROFILE.email; em.title = PROFILE.email; em.querySelector(".t").textContent = PROFILE.email;
  const li = document.getElementById("cbLinkedin"); li.href = PROFILE.linkedin;
}

function render(){
  const h = location.hash.replace("#","");
  const isBuild = h.endsWith("-build");
  const p = PRODUCTS.find(x=>x.id===(isBuild ? h.slice(0,-6) : h));
  if(p){
    app.innerHTML = product(p, isBuild ? "build" : "overview"); window.scrollTo(0,0);
  } else {
    if(!app.querySelector("#products")) app.innerHTML = home();
    const el = SECTIONS.includes(h) && document.getElementById(h);
    if(el && h!=="home") el.scrollIntoView(); else window.scrollTo(0,0);
  }
  document.querySelectorAll("[data-resume]").forEach(a=>{a.href=PROFILE.resumeUrl;a.target="_blank";a.rel="noopener";});
  document.title = p ? `${isBuild?'How I built ':''}${p.name} · ${PROFILE.name}` : `${PROFILE.name} · ${PROFILE.title}`;
}

const $q = id => document.getElementById(id);
function openRequest(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  $q("rqP").textContent = `${p.name} connects to a real Gmail inbox, so I share it personally. Tell me who you are and I'll send you access, or walk you through it on a call.`;
  ["rqName","rqOrg","rqEmail"].forEach(i=>$q(i).value="");
  $q("rqS").textContent = `If the button doesn't open your email app, write to ${PROFILE.email}.`;
  const build = () => {
    const subj = `Demo access request: ${p.name}`;
    const body = `Hi Divya,\n\nI'd like to see the ${p.name} demo from your portfolio.\n\nName: ${$q("rqName").value}\nCompany / role: ${$q("rqOrg").value}\nEmail for access: ${$q("rqEmail").value}\n\nThanks!`;
    $q("rqSend").href = `mailto:${PROFILE.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
    return {subj, body};
  };
  ["rqName","rqOrg","rqEmail"].forEach(i=>$q(i).oninput = build); build();
  $q("rqCopy").onclick = async () => { const {subj, body} = build(); try{ await navigator.clipboard.writeText(`To: ${PROFILE.email}\nSubject: ${subj}\n\n${body}`); $q("rqS").textContent = `Copied. Paste it into an email to ${PROFILE.email}.`; }catch(err){ $q("rqS").textContent = `Please email ${PROFILE.email} with the details above.`; } };
  $q("rq").classList.add("show"); document.body.classList.add("rqopen"); $q("rqName").focus();
}
const closeRq = () => { $q("rq").classList.remove("show"); document.body.classList.remove("rqopen"); };
$q("rqX").onclick = closeRq;
$q("rq").addEventListener("click", e => { if(e.target.id === "rq") closeRq(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeRq(); });
document.addEventListener("click", e=>{
  const rqb = e.target.closest("[data-request]");
  if(rqb){ e.preventDefault(); openRequest(rqb.dataset.request); return; }
  const j = e.target.closest("[data-jump]");
  if(j){ e.preventDefault(); const t=document.getElementById(j.dataset.jump); if(t) t.scrollIntoView({behavior:"smooth"}); }
});
window.addEventListener("hashchange", render);
fillChrome(); render();
</script>
</body>
</html>
